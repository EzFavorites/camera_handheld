name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-handheld-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-macos:
    name: Build macOS APP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build macOS release
        run: flutter build macos --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-handheld-macos
          path: build/macos/Build/Products/Release/camera_handheld.app
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      # Decode the release keystore and write android/key.properties ONLY for
      # tagged releases (v*). Non-tag builds skip this and Gradle falls back to
      # the debug key. Requires the following repository secrets to be set:
      #   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

      - name: Write key.properties
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "storeFile=release-key.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-handheld-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: camera-handheld-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: camera-handheld-macos
          path: dist/macos

      - uses: actions/download-artifact@v4
        with:
          name: camera-handheld-android
          path: dist/android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Camera Handheld ${{ github.ref_name }}
          body: |
            Windows EXE + macOS APP + Android APK 构建产物。
          files: |
            dist/windows/**
            dist/macos/**
            dist/android/**
